name:
  en: "EDISU Piemonte scholarship"
  ar: "منحة EDISU في بيدمونت"
  fr: "Bourse EDISU Piemonte"
provider: "EDISU Piemonte"
type: regional_dsu
region: piemonte
description:
  en: "Regional right-to-study (DSU) scholarship. It is means-tested and can include money, a place in a residence and meals. International students usually need an ISEE parificato. Check the yearly call for amounts and deadlines."
  ar: "منحة إقليمية لحق الدراسة (DSU). تُمنح حسب الوضع المادي وقد تشمل مبلغًا ماليًا وسكنًا في السكن الجامعي ووجبات. يحتاج الطلاب الدوليون عادةً إلى شهادة ISEE parificato. راجع الإعلان السنوي لمعرفة المبالغ والمواعيد."
  fr: "Bourse régionale du droit aux études (DSU). Elle est attribuée sur critères sociaux et peut comprendre une somme d'argent, une place en résidence et les repas. Les étudiants internationaux ont généralement besoin d'un ISEE parificato. Consultez l'appel annuel pour les montants et les dates limites."
eligibility:
  en: "Students enrolled full time or part time at a university in Piedmont who meet the income and merit requirements of the call, including international students. International students without residence in Italy apply with a temporary access code (Codice Temporaneo d'Accesso) instead of SPID."
  ar: "الطلاب المسجلون بدوام كامل أو جزئي في جامعة في بيدمونت ممن يستوفون شروط الدخل والتحصيل في الإعلان، ومنهم الطلاب الدوليون. الطلاب الدوليون غير المقيمين في إيطاليا يقدّمون برمز دخول مؤقت (⁦Codice Temporaneo d'Accesso⁩) بدل ⁦SPID⁩."
  fr: "Les étudiants inscrits à temps plein ou à temps partiel dans une université du Piémont qui remplissent les conditions de revenus et de mérite de l'appel, y compris les étudiants internationaux. Les étudiants internationaux sans résidence en Italie font la demande avec un code d'accès temporaire (Codice Temporaneo d'Accesso) au lieu du SPID."
url: https://www.edisu.piemonte.it/sites/default/files/schede-informative-borse-e-contributi-documenti/bando-20262027/Step_by_step_Primi_anni_2026_27.pdf
