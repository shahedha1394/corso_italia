name:
  en: "ER.GO scholarship (Emilia-Romagna)"
  ar: "منحة ER.GO (إميليا رومانيا)"
  fr: "Bourse ER.GO (Émilie-Romagne)"
provider: "ER.GO"
type: regional_dsu
region: emilia-romagna
description:
  en: "Regional right-to-study (DSU) scholarship. It is means-tested and can include money, a place in a residence and meals. International students usually need an ISEE parificato. Check the yearly call for amounts and deadlines."
  ar: "منحة إقليمية لحق الدراسة (DSU). تُمنح حسب الوضع المادي وقد تشمل مبلغًا ماليًا وسكنًا في السكن الجامعي ووجبات. يحتاج الطلاب الدوليون عادةً إلى شهادة ISEE parificato. راجع الإعلان السنوي لمعرفة المبالغ والمواعيد."
  fr: "Bourse régionale du droit aux études (DSU). Elle est attribuée sur critères sociaux et peut comprendre une somme d'argent, une place en résidence et les repas. Les étudiants internationaux ont généralement besoin d'un ISEE parificato. Consultez l'appel annuel pour les montants et les dates limites."
eligibility:
  en: "Students enrolled at a university in the region who meet the income and merit requirements of the call, including international students. Students from outside the EU must send official documents on their family's income and assets abroad (self-declarations are not accepted). Not for students who enrol in a course giving a degree of the same or a lower level than one they already hold."
  ar: "الطلاب المسجلون في جامعة داخل الإقليم ممن يستوفون شروط الدخل والتحصيل في الإعلان، ومنهم الطلاب الدوليون. على الطلاب من خارج الاتحاد الأوروبي تقديم وثائق رسمية عن دخل العائلة وممتلكاتها في الخارج (لا يُقبل الإقرار الشخصي). لا يحق لمن يسجل في برنامج يعطي شهادة من نفس مستوى شهادة يحملها أو أقل منها."
  fr: "Les étudiants inscrits dans une université de la région qui remplissent les conditions de revenus et de mérite de l'appel, y compris les étudiants internationaux. Les étudiants hors UE doivent fournir des documents officiels sur les revenus et le patrimoine de leur famille à l'étranger (les déclarations sur l'honneur ne sont pas acceptées). Pas pour ceux qui s'inscrivent à un cursus donnant un diplôme de niveau égal ou inférieur à un diplôme qu'ils ont déjà."
