name:
  en: "Italian Government scholarships (MAECI)"
  ar: "منح الحكومة الإيطالية (MAECI)"
provider: "Italian Ministry of Foreign Affairs"
type: government
description:
  en: "Scholarships from the Italian Ministry of Foreign Affairs for foreign students studying in Italy. Applications are made only through the Study in Italy portal. The 2026/27 call closed on 26 March 2026."
  ar: "منح من وزارة الخارجية الإيطالية للطلاب الأجانب الذين يدرسون في إيطاليا. يتم التقديم فقط عبر بوابة Study in Italy. أُغلق باب التقديم لعام 2026/27 في 26 مارس 2026."
eligibility:
  en: "Citizens of the countries on the eligible-countries list published on the portal."
  ar: "مواطنو الدول المدرجة في قائمة الدول المؤهلة المنشورة على البوابة."
url: https://studyinitaly.esteri.it
sources:
  - label: "Embassy of Italy in Abuja: 2026/27 call"
    url: https://ambabuja.esteri.it/en/news/dall_ambasciata/2026/03/borse-di-studio-per-la-a-2026-2027-offerte-dal-governo-italiano-a-studenti-stranieri/
last_checked: 2026-10-25
