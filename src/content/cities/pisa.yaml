description:
  en: "A city in Tuscany, central Italy, near the coast and about an hour by train from Florence."
  ar: "مدينة في منطقة توسكانا وسط إيطاليا، قريبة من البحر وعلى بعد ساعة تقريباً بالقطار من فلورنسا."
  fr: "Ville de Toscane, au centre de l'Italie, près de la côte et à environ une heure de train de Florence."
