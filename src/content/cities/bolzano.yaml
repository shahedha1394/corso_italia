description:
  en: "Capital of South Tyrol in the Alps of northern Italy, where Italian and German are both spoken."
  ar: "عاصمة جنوب تيرول في جبال الألب شمال إيطاليا، ويُتحدث فيها الإيطالية والألمانية."
  fr: "Capitale du Haut-Adige, dans les Alpes du nord de l'Italie, où l'on parle italien et allemand."
