description:
  en: "Capital of Friuli Venezia Giulia, a port city in north-eastern Italy near the border with Slovenia."
  ar: "عاصمة منطقة فريولي فينيتسيا جوليا، مدينة فيها ميناء في شمال شرق إيطاليا قرب الحدود مع سلوفينيا."
  fr: "Capitale du Frioul-Vénétie Julienne, ville portuaire du nord-est de l'Italie, près de la frontière slovène."
