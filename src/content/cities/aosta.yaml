description:
  en: "Capital of the Aosta Valley, in the Alps of north-western Italy, where Italian and French are both official."
  ar: "عاصمة منطقة وادي أوستا في جبال الألب شمال غرب إيطاليا، واللغتان الرسميتان فيها الإيطالية والفرنسية."
  fr: "Chef-lieu de la Vallée d'Aoste, dans les Alpes du nord-ouest de l'Italie, où l'italien et le français sont tous deux langues officielles."
