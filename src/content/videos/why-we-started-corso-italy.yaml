description:
  en: "Shahed tells how the idea began in the Mavrovouni camp on Lesvos, where many people did not know that studying can be a safe, legal way to come to Italy. In Arabic."
  ar: "تحكي شهد كيف بدأت الفكرة في مخيم مافروفوني في ليسبوس، حيث لم يكن كثيرون يعرفون أن الدراسة طريق آمن وقانوني للوصول إلى إيطاليا."
  fr: "Shahed raconte comment l'idée est née dans le camp de Mavrovouni, à Lesbos, où beaucoup ne savaient pas qu'étudier peut être un moyen sûr et légal de venir en Italie. En arabe."
