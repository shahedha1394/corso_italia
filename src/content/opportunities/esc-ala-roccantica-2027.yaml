  en: "Two weeks of outdoor work building and marking mountain trails in Roccantica, near Rome. Ages 18-30. Open to residents of Georgia, Moldova, the Western Balkans and the EU, not Arab countries. Accommodation and meals covered, travel reimbursed."
  ar: "أسبوعان من العمل في الطبيعة لشق مسارات المشي الجبلية وتعليمها في روكانتيكا قرب روما. من 18 إلى 30 عاماً. مفتوح للمقيمين في جورجيا ومولدوفا ودول غرب البلقان والاتحاد الأوروبي، وليس للدول العربية. السكن والطعام مغطيان، والسفر يُسترد."
  fr: "Deux semaines de travail en plein air pour créer et baliser des sentiers de montagne à Roccantica, près de Rome. 18 à 30 ans. Ouvert aux résidents de Géorgie, de Moldavie, des Balkans occidentaux et de l'UE, pas des pays arabes. Logement et repas pris en charge, voyage remboursé."
