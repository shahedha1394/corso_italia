title:
  en: "Complete your enrolment (visa holders, 2026/27)"
  ar: "أكمل تسجيلك في الجامعة (حاملو التأشيرة، 2026/27)"
  fr: "Finaliser votre inscription (titulaires d'un visa, 2026/27)"
type: other
date: 2027-01-31
note:
  en: "Students who entered Italy with a study visa for 2026/27 and are not enrolled on Universitaly by 31 January have their visa revoked, and the Questura is informed."
  ar: "الطلاب الذين دخلوا إيطاليا بتأشيرة دراسة للعام 2026/27 ولم يُسجَّلوا في ⁦Universitaly⁩ حتى 31 كانون الثاني/يناير تُلغى تأشيراتهم، وتُبلَّغ الكويستورا بذلك."
  fr: "Les étudiants entrés en Italie avec un visa d'études pour 2026/27 qui ne sont pas inscrits sur Universitaly au 31 janvier voient leur visa révoqué, et la Questura en est informée."
url: https://www.unife.it/it/internazionale/venire/iscriversi/informazioni/circolare_2026-2027_studenti_internazionali.pdf
last_checked: 2026-10-29
