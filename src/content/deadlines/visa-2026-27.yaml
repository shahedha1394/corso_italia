title:
  en: "Study visa applications for 2026/27"
  ar: "طلبات تأشيرة الدراسة للعام 2026/27"
  fr: "Demandes de visa d'études pour 2026/27"
type: visa
date: 2026-11-30
note:
  en: "Last day to apply for a study visa at the Italian embassy or consulate for degree programmes starting in 2026/27. Your pre-enrolment must already be validated by the university, and some universities set an earlier date."
  ar: "آخر يوم لطلب تأشيرة الدراسة في السفارة أو القنصلية الإيطالية لبرامج العام 2026/27. يجب أن تكون الجامعة قد صادقت على تسجيلك المسبق، وبعض الجامعات تحدّد موعداً أبكر."
  fr: "Dernier jour pour demander un visa d'études à l'ambassade ou au consulat d'Italie pour les formations qui commencent en 2026/27. Votre préinscription doit déjà être validée par l'université, et certaines universités fixent une date antérieure."
url: https://www.unife.it/it/internazionale/venire/iscriversi/informazioni/circolare_2026-2027_studenti_internazionali.pdf
last_checked: 2026-10-29
